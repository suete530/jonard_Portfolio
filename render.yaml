services:
  - type: web
    name: jonard-portfolio
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FLASK_ENV
        value: production
      - key: SESSION_COOKIE_SECURE
        value: "1"
      # Awtomatikong bibigyan ng mahabang random value ng Render
      - key: SECRET_KEY
        generateValue: true
      # Ipapasok mo sa Render Dashboard (Environment tab)
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL_REQUIRED
        value: "1"
      # Email (Resend) — card-free, walang SMTP
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_TO
        sync: false
      - key: MAIL_FROM
        value: Portfolio <onboarding@resend.dev>
      # Images (Cloudinary)
      - key: CLOUDINARY_URL
        sync: false
      # AI assistant (opsyonal)
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: AI_MODEL
        value: meta-llama/llama-3.1-8b-instruct
      # Social links (blangko = nakatago ang button)
      - key: FACEBOOK_URL
        value: https://www.facebook.com/profile.php?id=61594507312243
      - key: TIKTOK_URL
        sync: false
