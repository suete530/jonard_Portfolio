{% extends "admin/base_admin.html" %}
{% block title %}{{ 'Edit' if template else 'New' }} Template{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold text-white mb-6">{{ 'I-edit' if template else 'Bagong' }} Template</h1>

<form method="POST" enctype="multipart/form-data" class="max-w-2xl space-y-5">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <div>
    <label class="block text-sm text-slate-400 mb-1.5">Title *</label>
    <input type="text" name="title" maxlength="150" required value="{{ template.title if template else '' }}"
           class="w-full rounded-lg bg-slate-900 border border-slate-700 focus:border-brand focus:ring-0 px-3.5 py-2.5 text-slate-100 outline-none">
  </div>

  <div>
    <label class="block text-sm text-slate-400 mb-1.5">Summary</label>
    <input type="text" name="summary" maxlength="300" value="{{ template.summary if template else '' }}"
           class="w-full rounded-lg bg-slate-900 border border-slate-700 focus:border-brand focus:ring-0 px-3.5 py-2.5 text-slate-100 outline-none">
  </div>

  <div>
    <label class="block text-sm text-slate-400 mb-1.5">Description</label>
    <textarea name="description" rows="6" maxlength="5000"
              class="w-full rounded-lg bg-slate-900 border border-slate-700 focus:border-brand focus:ring-0 px-3.5 py-2.5 text-slate-100 outline-none">{{ template.description if template else '' }}</textarea>
  </div>

  <div class="grid sm:grid-cols-2 gap-4">
    <div>
      <label class="block text-sm text-slate-400 mb-1.5">Tech Stack (comma-separated)</label>
      <input type="text" name="tech_stack" maxlength="255" value="{{ template.tech_stack if template else '' }}"
             placeholder="HTML, Tailwind, Flask"
             class="w-full rounded-lg bg-slate-900 border border-slate-700 focus:border-brand focus:ring-0 px-3.5 py-2.5 text-slate-100 outline-none">
    </div>
    <div>
      <label class="block text-sm text-slate-400 mb-1.5">Price</label>
      <input type="text" name="price" maxlength="50" value="{{ template.price if template else '' }}"
             placeholder="₱1,500"
             class="w-full rounded-lg bg-slate-900 border border-slate-700 focus:border-brand focus:ring-0 px-3.5 py-2.5 text-slate-100 outline-none">
    </div>
  </div>

  <div class="grid sm:grid-cols-2 gap-4">
    <div>
      <label class="block text-sm text-slate-400 mb-1.5">Live Demo URL</label>
      <input type="url" name="demo_url" maxlength="500" value="{{ template.demo_url if template else '' }}"
             class="w-full rounded-lg bg-slate-900 border border-slate-700 focus:border-brand focus:ring-0 px-3.5 py-2.5 text-slate-100 outline-none">
    </div>
    <div>
      <label class="block text-sm text-slate-400 mb-1.5">Buy URL (Gumroad / PayPal / atbp.)</label>
      <input type="url" name="buy_url" maxlength="500" value="{{ template.buy_url if template else '' }}"
             class="w-full rounded-lg bg-slate-900 border border-slate-700 focus:border-brand focus:ring-0 px-3.5 py-2.5 text-slate-100 outline-none">
    </div>
  </div>

  <div>
    <label class="block text-sm text-slate-400 mb-1.5">Image URL (o mag-upload sa baba)</label>
    <input type="text" name="image_url" maxlength="500" value="{{ template.image_url if template else '' }}"
           class="w-full rounded-lg bg-slate-900 border border-slate-700 focus:border-brand focus:ring-0 px-3.5 py-2.5 text-slate-100 outline-none">
  </div>

  <div>
    <label class="block text-sm text-slate-400 mb-1.5">Upload Image (png/jpg/webp/gif, max 4MB)</label>
    <input type="file" name="image" accept="image/*"
           class="w-full text-sm text-slate-400 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-slate-800 file:text-slate-200 hover:file:bg-slate-700">
  </div>

  <div class="grid sm:grid-cols-2 gap-4 items-center">
    <div>
      <label class="block text-sm text-slate-400 mb-1.5">Sort order (maliit = nauuna)</label>
      <input type="number" name="sort_order" value="{{ template.sort_order if template else 0 }}"
             class="w-full rounded-lg bg-slate-900 border border-slate-700 focus:border-brand focus:ring-0 px-3.5 py-2.5 text-slate-100 outline-none">
    </div>
    <label class="flex items-center gap-2 mt-6">
      <input type="checkbox" name="is_visible" class="rounded bg-slate-800 border-slate-600"
             {{ 'checked' if (not template) or template.is_visible else '' }}>
      <span class="text-sm text-slate-300">Visible sa public site</span>
    </label>
  </div>

  <div class="flex gap-3 pt-2">
    <button type="submit" class="px-5 py-2.5 rounded-lg bg-brand hover:bg-brand-dark text-white font-medium transition">I-save</button>
    <a href="{{ url_for('admin.templates') }}" class="px-5 py-2.5 rounded-lg border border-slate-700 hover:border-slate-500 text-slate-200 font-medium transition">Cancel</a>
  </div>
</form>
{% endblock %}
